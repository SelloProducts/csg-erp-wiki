site_name: CSG ERP User Service
site_url: !ENV [SITE_URL, 'http://127.0.0.1:8000/']
docs_dir: docs
site_dir: site
use_directory_urls: true


theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/image-sizing.js

nav:
  - Home: index.md
  - Complete User Manual: manual/CSG_ERP_Complete_User_Manual.md
  - Manual by Module:
      - "1. Introduction": manual/modules/01-introduction.md
      - "2. Login": manual/modules/02-login.md
      - "3. Dashboard": manual/modules/03-dashboard.md
      - "4. Account Center": manual/modules/04-account-center.md
      - "5. User Management": manual/modules/05-user-management.md
      - "6. Channel Management": manual/modules/06-channel-management.md
      - "7. Product": manual/modules/07-product.md
      - "8. Logistics": manual/modules/08-logistics.md
      - "9. Inbound": manual/modules/09-inbound.md
      - "10. Inventory": manual/modules/10-inventory.md
      - "11. Outbound": manual/modules/11-outbound.md
      - "12. Returns Management": manual/modules/12-returns-management.md
      - "13. Report": manual/modules/13-report.md
      - "14. Billing & Invoice": manual/modules/14-billing-and-invoice.md
      - "15. Ticket": manual/modules/15-ticket.md
      - "16. Appendix": manual/modules/16-appendix.md
